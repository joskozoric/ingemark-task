spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/idm
  datasource:
    url: jdbc:postgresql://localhost:5432/productdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true

server:
  error:
    include-message: always