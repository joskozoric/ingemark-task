version: '3.8'

services:
  product-db:
    image: postgres:15-alpine
    container_name: product-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql
      - product_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d keycloakdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
    container_name: keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://product-db:5432/keycloakdb
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: password

      KC_DB_SCHEMA: public
      KC_HTTP_ENABLED: true
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_IMPORT_REALM: /opt/keycloak/data/import/product-realm.json

      KC_FEATURES: token-exchange,admin-fine-grained-authz

    ports:
      - "8080:8080"

    depends_on:
      product-db:
        condition: service_healthy # Wait for the database to be fully ready

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/product-realm.json:/opt/keycloak/data/import/product-realm.json

volumes:
  product_data:
  keycloak_data:
